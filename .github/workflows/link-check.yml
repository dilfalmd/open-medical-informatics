name: Link check

# Controllo dei link: una volta al mese e a mano.
# Monthly link check, plus manual runs.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # eur-lex.europa.eu e data.europa.eu/eli bloccano i bot: esclusi dal controllo.
          # I siti istituzionali che rispondono 403 (anti-bot) sono accettati.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept '200..=299,403,429'
            --exclude 'eur-lex\.europa\.eu'
            --exclude 'data\.europa\.eu/eli'
            'README.md' 'README.it.md' 'CONTRIBUTING.md'
          fail: false
          lycheeVersion: v0.24.2

      - name: Find an open link-check issue
        if: steps.lychee.outputs.exit_code != 0
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label link-check --state open --limit 1 --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue if there are broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          issue-number: ${{ steps.existing.outputs.number }}
          title: "Link check: broken links / Controllo link: link rotti"
          content-filepath: ./lychee/out.md
          labels: link-check, automated
